name: Идея или просьба
description: Чего не хватает, что неудобно, что стоит сделать иначе
labels: ['идея']
body:
  - type: markdown
    attributes:
      value: |
        Идеи приветствуются. Не обещаю сделать всё и сразу — но читаю каждую.

  - type: textarea
    id: what
    attributes:
      label: Что предлагаешь
      description: Одно-два предложения, без подробностей — их напишешь ниже.
      placeholder: 'Хочу горячую клавишу, чтобы отложить текущий трек и вернуться к нему позже'
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Зачем это тебе
      description: Как ты это делаешь сейчас и что неудобно. Лучшая часть заявки — реальная ситуация со стрима.
      placeholder: 'Во время стрима часто просят «подожди, доиграет» — сейчас приходится вручную убирать трек из очереди'
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: Как это могло бы выглядеть (по желанию)
      description: Кнопка, сочетание клавиш, пункт меню — как удобнее.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Чего касается
      options:
        - Поиск и воспроизведение
        - Волна
        - Плейлисты, история, книги
        - Заказы и донаты
        - Twitch-бот и оверлей (пак стримера)
        - Оформление и оболочки
        - Настройки, обновления
        - Другое
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Проверь перед отправкой
      options:
        - label: Я поискал похожие идеи и не нашёл такую же
          required: true
